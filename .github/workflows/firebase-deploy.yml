name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/optimistic-darwin-qo3x8
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build public directory
        run: |
          mkdir -p public
          cp "Optik-Zada v7.7 (Beta Version).html" public/index.html
          if [ -d assets ]; then cp -r assets public/; fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPTIK_ZADA1127 }}
          channelId: live
          projectId: optik-zada1127
